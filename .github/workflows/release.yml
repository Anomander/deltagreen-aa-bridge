name: Release Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A failing suite cannot ship. The manifest test in particular guards the
      # zip contents below against a path the manifest declares.
      - name: Run unit tests
        run: |
          npm install
          npm test

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the manifest
        run: |
          MANIFEST_VERSION=$(jq -r '.version' module.json)
          if [[ "$MANIFEST_VERSION" != "${{ steps.version.outputs.value }}" ]]; then
            echo "::error::module.json says $MANIFEST_VERSION, tag says ${{ steps.version.outputs.value }}"
            exit 1
          fi

      - name: Stamp manifest with release version and URLs
        uses: microsoft/variable-substitution@v1
        with:
          files: module.json
        env:
          version: ${{ steps.version.outputs.value }}
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.zip

      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md scripts lang

      - name: Verify the zip contains everything module.json declares
        run: |
          MISSING=0
          CONTENTS=$(unzip -Z1 module.zip)
          while IFS= read -r declared; do
            [[ -z "$declared" ]] && continue
            if ! grep -qxF "$declared" <<< "$CONTENTS"; then
              echo "::error::module.json declares '$declared', but it is not in module.zip"
              MISSING=1
            fi
          done < <(jq -r '[
              .esmodules[]?,
              (.styles[]? | if type == "object" then .src else . end),
              .languages[]?.path
            ] | .[]' module.json)
          if [[ "$MISSING" == "1" ]]; then
            echo "Archive contents were:"
            echo "$CONTENTS"
            exit 1
          fi
          echo "All manifest-declared paths are present in the archive."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip

      - name: Read module metadata
        id: module
        run: |
          echo "id=$(jq -r '.id' module.json)" >> $GITHUB_OUTPUT
          echo "compat_min=$(jq -r '.compatibility.minimum' module.json)" >> $GITHUB_OUTPUT
          echo "compat_verified=$(jq -r '.compatibility.verified' module.json)" >> $GITHUB_OUTPUT
          echo "compat_max=$(jq -r '.compatibility.maximum' module.json)" >> $GITHUB_OUTPUT

      # Skipped silently when no token is configured, so the GitHub release
      # still succeeds on a repo that has not been registered with Foundry.
      - name: Release Foundry package
        env:
          FOUNDRY_API_TOKEN: ${{ secrets.FOUNDRY_API_TOKEN }}
        if: env.FOUNDRY_API_TOKEN != ''
        run: |
          jq -n \
            --arg id "${{ steps.module.outputs.id }}" \
            --arg version "${{ steps.version.outputs.value }}" \
            --arg manifest "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.json" \
            --arg download "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.zip" \
            --arg notes "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --arg compat_min "${{ steps.module.outputs.compat_min }}" \
            --arg compat_verified "${{ steps.module.outputs.compat_verified }}" \
            --arg compat_max "${{ steps.module.outputs.compat_max }}" \
            '{
              id: $id,
              release: {
                version: $version,
                manifest: $manifest,
                download: $download,
                notes: $notes,
                compatibility: (
                  {minimum: $compat_min, verified: $compat_verified}
                  + (if $compat_max == "" or $compat_max == "null" then {} else {maximum: $compat_max} end)
                )
              }
            }' > payload.json

          curl -X POST "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.FOUNDRY_API_TOKEN }}" \
            -d @payload.json
