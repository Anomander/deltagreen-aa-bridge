name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Neither the system nor Automated Animations is installed here, so the
      # two drift tests assert against their committed snapshots alone. Drift
      # itself is caught on a developer's machine, where both are present.
      - name: Run unit tests
        run: npm test
